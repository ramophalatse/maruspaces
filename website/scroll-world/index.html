<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Maru Spaces — Design. Interiors. Landscape. Assessed.</title>
  <meta name="description" content="Scroll through the Maru Spaces design ethos — design, interiors, landscape and conditional assessments." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* Brand kit — per Maru Spaces brand guide (MS · BG · 2026.01):
       Display = DM Serif Display, Editorial = Cormorant Garamond (italic),
       Body/UI = DM Sans, Technical/labels = JetBrains Mono. All Google Fonts. */
    :root, .sw-root {
      --sw-bg: #EDE6D8;
      --sw-ink: #1B1712;
      --sw-ink-soft: #6b6156;
      --sw-accent: #AE5A34;
      --sw-font-display: 'DM Serif Display', Georgia, serif;
      --sw-font-editorial: 'Cormorant Garamond', Georgia, serif;
      --sw-font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      --sw-font-mono: 'JetBrains Mono', monospace;
    }
    :root[data-theme="dark"], .sw-root[data-theme="dark"] {
      --sw-bg: #1B1712;
      --sw-ink: #EDE6D8;
      --sw-ink-soft: #a89c8d;
      --sw-accent: #c9704a;
    }
    body { margin: 0; }

    /* Day/night switch — same pill-with-knob component as the Sanctuary
       Mandela hero, so the two builds read as one brand once merged. */
    .theme-switch {
      position: fixed; z-index: 200; top: clamp(64px, 9vw, 86px); right: clamp(18px, 5vw, 64px);
      display: flex; align-items: center; justify-content: space-between;
      width: 62px; height: 34px; padding: 0 7px;
      background: rgba(27, 23, 18, 0.92); border: none; border-radius: 999px;
      backdrop-filter: blur(8px); box-shadow: 0 10px 30px -8px rgba(0,0,0,0.5);
      cursor: pointer;
      transition: top .5s cubic-bezier(.16,.8,.24,1);
    }
    .theme-switch .icon { position: absolute; top: 10px; z-index: 1; display: flex; color: #8A7F6C; transition: color 0.3s ease; }
    .theme-switch .icon svg { width: 14px; height: 14px; display: block; }
    .theme-switch .icon.sun { left: 10px; }
    .theme-switch .icon.moon { left: 38px; }
    .theme-switch[aria-checked="false"] .icon.sun { color: #AE5A34; }
    .theme-switch[aria-checked="true"] .icon.moon { color: #F1EAD9; }
    .theme-switch .knob {
      position: absolute; top: 3px; left: 3px; width: 28px; height: 28px;
      border-radius: 50%; background: #F6F1E7; box-shadow: 0 2px 6px rgba(0,0,0,0.35);
      transition: transform 0.4s cubic-bezier(.16,.8,.24,1), background 0.4s ease;
    }
    .theme-switch[aria-checked="true"] .knob { transform: translateX(28px); background: #AE5A34; }
    .theme-switch:focus-visible { outline: 2px solid var(--sw-accent); outline-offset: 3px; }
    body.sw-past-hero .theme-switch { top: clamp(14px, 2.4vw, 26px); }

    /* the switch floats fixed in the same corner as the topbar's CTA pill —
       give the CTA breathing room so the two don't overlap */
    .sw-topcta { margin-right: clamp(64px, 8vw, 76px); }

    /* Wordmark — centered above the nav row, only present over the first
       (Design) scene, same behavior as the Sanctuary Mandela hero's
       brand-mark: it scrolls/fades away once you're past that scene, and
       the nav pill / CTA / switch rise to reclaim the space it held
       (driven by the body.sw-past-hero class the engine toggles). */
    #world .sw-nav { top: clamp(64px, 9vw, 86px); }
    #world .sw-topbar { padding-top: clamp(64px, 9vw, 86px); justify-content: flex-end; }
    body.sw-past-hero #world .sw-topbar { padding-top: clamp(14px, 2.4vw, 26px); }
    body.sw-past-hero #world .sw-nav { top: clamp(14px, 2.4vw, 26px); }
    .sw-wordmark {
      position: fixed; z-index: 55; top: clamp(14px, 2.4vw, 26px); left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      transition: opacity .5s ease, transform .5s cubic-bezier(.16,.8,.24,1);
    }
    .sw-wordmark svg, .sw-wordmark--bottom svg {
      height: 34px; width: auto; display: block; color: var(--sw-ink);
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.25));
      transition: color .3s ease;
    }
    body.sw-past-hero .sw-wordmark { opacity: 0; transform: translateX(-50%) translateY(-10px); }

    /* Bottom-centre wordmark — the inverse of the top one: hidden over the
       first (Design) scene, fades in once past-hero (nav has already
       risen to the top and the top wordmark has faded out). */
    .sw-wordmark--bottom {
      position: fixed; z-index: 55; bottom: clamp(14px, 2.4vw, 26px); left: 50%;
      transform: translateX(-50%) translateY(10px);
      pointer-events: none;
      opacity: 0;
      transition: opacity .5s ease, transform .5s cubic-bezier(.16,.8,.24,1);
    }
    body.sw-past-hero .sw-wordmark--bottom { opacity: 1; transform: translateX(-50%) translateY(0); }
    .sw-wordmark--bottom svg { color: #fff; }

    /* Scene 4 (Conditional Assessments) service-category overlay.
       Higgsfield video can't render legible text, so these are real DOM
       elements pinned over the birds-eye clip, faded via JS mirroring that
       scene's own opacity (see script at bottom of body). */
    #assessments-overlay {
      position: fixed; inset: 0; z-index: 15; pointer-events: none; opacity: 0;
    }
    #assessments-overlay .aow-tag {
      position: absolute;
      display: flex; flex-direction: column; gap: 4px;
      padding: 12px 18px; border-radius: 14px;
      background: color-mix(in srgb, var(--sw-bg) 72%, transparent);
      backdrop-filter: blur(8px);
      border: 1px solid color-mix(in srgb, var(--sw-accent) 35%, transparent);
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      font-family: var(--sw-font-body);
    }
    #assessments-overlay .aow-tag i {
      width: 8px; height: 8px; border-radius: 50%; background: var(--sw-accent);
      position: absolute; top: -4px; left: -4px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--sw-accent) 25%, transparent);
    }
    #assessments-overlay .aow-tag b {
      font-size: 0.8rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--sw-accent);
    }
    #assessments-overlay .aow-tag span {
      font-size: 0.8rem; color: var(--sw-ink-soft);
    }
    #assessments-overlay .aow-tag--structural { top: 24%; left: 12%; }
    #assessments-overlay .aow-tag--safety { top: 16%; right: 14%; }
    #assessments-overlay .aow-tag--compliance { bottom: 20%; left: 46%; }
    @media (max-width: 860px) {
      #assessments-overlay .aow-tag { padding: 9px 14px; }
      #assessments-overlay .aow-tag--structural { top: 18%; left: 8%; }
      #assessments-overlay .aow-tag--safety { top: 12%; right: 8%; }
      #assessments-overlay .aow-tag--compliance { bottom: 30%; left: 30%; }
    }
  </style>
</head>

  <script>
    mountScrollWorld(document.getElementById('world'), {
      cta: { label: 'Start a project', href: '#' },
      hint: 'scroll to fly through',
      diveScroll: 1.4,
      connScroll: 0.9,
      sections: [
        {
          id: 'design', label: 'Design',
          still: 'assets/img/leg1_day.jpg', clip: 'assets/vid/leg1_day.mp4',
          stillNight: 'assets/img/leg1_night.jpg', clipNight: 'assets/vid/leg1_night.mp4',
          accent: '#AE5A34',
          scroll: 1.7, linger: 0.4,
          copyTheme: 'dark',
          eyebrow: 'Turnkey Architectural Design',
          title: 'Spaces with purpose, light, and a quiet centre.',
          body: 'Maru Spaces is a boutique architecture studio. We craft timeless interiors, innovative builds, and turnkey projects for commercial, public infrastructure and hospitality briefs across South Africa and Namibia.',
          tags: [],
        },
        {
          id: 'interior', label: 'Interior',
          still: 'assets/img/leg2_day.jpg', clip: 'assets/vid/leg2_day.mp4',
          stillNight: 'assets/img/leg2_night.jpg', clipNight: 'assets/vid/leg2_night.mp4',
          accent: '#8F8270',
          eyebrow: 'Interior Architecture',
          title: 'Where craft meets calm.',
          body: 'We take interiors from spatial planning through to final fit-out: joinery, lighting design, material selection and furniture curation, handled as one integrated service.',
          tags: [],
        },
        {
          id: 'landscape', label: 'Landscape',
          still: 'assets/img/leg3_day.jpg', clip: 'assets/vid/leg3_day.mp4',
          stillNight: 'assets/img/leg3_night.jpg', clipNight: 'assets/vid/leg3_night.mp4',
          accent: '#5C7A5A',
          eyebrow: 'Landscape Design',
          title: 'The building doesn’t end at the wall.',
          body: 'Gardens conceived alongside the architecture, not after it. Every threshold is designed to carry the eye outward.',
          tags: [],
        },
        {
          id: 'assessments', label: 'Assessments',
          still: 'assets/img/leg4_day.jpg', clip: 'assets/vid/leg4_day.mp4',
          stillNight: 'assets/img/leg4_night.jpg', clipNight: 'assets/vid/leg4_night.mp4',
          accent: '#3E5C76',
          scroll: 1.6, linger: 0.4,
          copyAlign: 'right',
          eyebrow: 'Conditional Assessments',
          title: 'Where we stand.',
          body: 'A structured condition survey across finishes, structure, services, envelope and life-safety, captured, graded and photographed. Where specialist certification is needed, we say so, giving you an evidenced basis for transactions, insurance and planning decisions.',
          tags: [],
          cta: { primary: { label: 'Start a project', href: '#' } },
        },
      ],
      connectors: [],
    });

    // Day/night toggle — same switch component and data-theme attribute
    // pattern as the Sanctuary Mandela hero build, so the two merge cleanly.
    const toggle = document.getElementById('theme-toggle');
    function setTheme(dark) {
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      toggle.setAttribute('aria-checked', dark ? 'true' : 'false');
      toggle.setAttribute('aria-label', dark ? 'Switch to day view' : 'Switch to night view');
      toggle.setAttribute('title', dark ? 'Switch to day view' : 'Switch to night view');
    }
    setTheme(false);
    toggle.addEventListener('click', () => setTheme(document.documentElement.dataset.theme !== 'dark'));

    // Assessments overlay — mirrors scene 4's own opacity (the engine computes
    // per-scene crossfade opacity each frame on .sw-scene elements in DOM
    // order; with no connectors, SEGMENTS order === SECTIONS order, so the
    // 4th .sw-scene is Assessments).
    const overlay = document.getElementById('assessments-overlay');
    function syncOverlay() {
      const scenes = document.querySelectorAll('#world .sw-scene');
      const assessmentsScene = scenes[3];
      if (assessmentsScene) overlay.style.opacity = assessmentsScene.style.opacity || 0;
      requestAnimationFrame(syncOverlay);
    }
    requestAnimationFrame(syncOverlay);
  </script>
</body>
